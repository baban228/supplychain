server:
  port: 8080

auth:
  jwt:
    # Must be exactly the same value as SECRET_KEY in Wolf Auth Service.
    secret: ${AUTH_JWT_SECRET:local-dev-only-change-me-32-bytes-min}

spring:
  application:
    name: api-gateway
  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        service-name: api-gateway
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        health-check-timeout: 5s
        query-passing: true
    loadbalancer:
      cache:
        enabled: true
    gateway:
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders,/api/orders/**
          filters:
            - StripPrefix=1

        - id: supplier-service
          uri: lb://supplier-service
          predicates:
            - Path=/api/suppliers,/api/suppliers/**
          filters:
            - StripPrefix=1

        - id: supplier-products
          uri: lb://supplier-service
          predicates:
            - Path=/api/products,/api/products/**
          filters:
            - StripPrefix=1

        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/api/deliveries,/api/deliveries/**

        - id: wolf-auth
          uri: lb://auth-service
          predicates:
            - Path=/auth,/auth/**,/users,/users/**,/roles,/roles/**,/friends,/friends/**,/notifications,/notifications/**,/achievements,/achievements/**,/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
