server:
  port: 8080

auth:
  jwt:
    # Must be exactly the same value as SECRET_KEY in Wolf Auth Service.
    secret: ${AUTH_JWT_SECRET:local-dev-only-change-me-32-bytes-min}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-service:8081}
          predicates:
            - Path=/api/orders,/api/orders/**
          filters:
            - StripPrefix=1

        - id: supplier-service
          uri: ${SUPPLIER_SERVICE_URL:http://supplier-service:8000}
          predicates:
            - Path=/api/suppliers,/api/suppliers/**
          filters:
            - StripPrefix=1

        - id: supplier-products
          uri: ${SUPPLIER_SERVICE_URL:http://supplier-service:8000}
          predicates:
            - Path=/api/products,/api/products/**
          filters:
            - StripPrefix=1

        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URL:http://delivery-service:3000}
          predicates:
            - Path=/api/deliveries,/api/deliveries/**

        # Wolf Auth Service. Its Compose service name in this integrated project is "auth-service".
        # If you rename it, set AUTH_SERVICE_URL to the new Compose service name and port.
        - id: wolf-auth
          uri: ${AUTH_SERVICE_URL:http://auth-service:3001}
          predicates:
            - Path=/auth,/auth/**,/users,/users/**,/roles,/roles/**,/friends,/friends/**,/notifications,/notifications/**,/achievements,/achievements/**,/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
