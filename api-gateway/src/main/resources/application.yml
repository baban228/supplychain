server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-service:8081}
          predicates:
            - Path=/api/orders,/api/orders/**
          filters:
            - StripPrefix=1

        - id: supplier-service
          uri: ${SUPPLIER_SERVICE_URL:http://supplier-service:8000}
          predicates:
            - Path=/api/suppliers,/api/suppliers/**
          filters:
            - StripPrefix=1

        - id: supplier-products
          uri: ${SUPPLIER_SERVICE_URL:http://supplier-service:8000}
          predicates:
            - Path=/api/products,/api/products/**
          filters:
            - StripPrefix=1

        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URL:http://delivery-service:3000}
          predicates:
            - Path=/api/deliveries,/api/deliveries/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
