services:

  frontend:
    build: ./frontend
    container_name: supplychain-frontend
    ports:
      - "127.0.0.1:5173:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Kafka broker (single-node KRaft mode for local development)
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped


  # Consul Service Discovery
  consul:
    image: hashicorp/consul:1.20
    container_name: consul
    command: ["agent", "-dev", "-ui", "-client=0.0.0.0", "-config-dir=/consul/config"]
    ports:
      - "127.0.0.1:8500:8500"
    volumes:
      - ./infrastructure/consul/services.json:/consul/config/services.json:ro
      - consul-data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  postgres-supplier:
    image: postgres:16-alpine
    container_name: postgres-supplier
    environment:
      POSTGRES_DB: supplier_db
      POSTGRES_USER: supplychain
      POSTGRES_PASSWORD: ${SUPPLIER_DB_PASSWORD:-supplychain_dev_password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - supplier-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplychain -d supplier_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  supplier-service:
    build: ./supplier-service
    container_name: supplier-service
    environment:
      DATABASE_URL: postgresql+psycopg2://supplychain:${SUPPLIER_DB_PASSWORD:-supplychain_dev_password}@postgres-supplier:5432/supplier_db
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres-supplier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${ORDER_DB_USER:-supplychain}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-supplychain_dev_password}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER:-supplychain} -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      ORDER_DATABASE_URL: r2dbc:postgresql://postgres-order:5432/order_db
      ORDER_DB_USER: ${ORDER_DB_USER:-supplychain}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-supplychain_dev_password}
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SUPPLIER_CLIENT_TIMEOUT: ${SUPPLIER_CLIENT_TIMEOUT:-2s}
      SUPPLIER_RETRY_MAX_ATTEMPTS: ${SUPPLIER_RETRY_MAX_ATTEMPTS:-3}
      SUPPLIER_RETRY_WAIT: ${SUPPLIER_RETRY_WAIT:-300ms}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres-order:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  postgres-delivery:
    image: postgres:16-alpine
    container_name: postgres-delivery
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: ${DELIVERY_DB_USER:-supplychain}
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASSWORD:-supplychain_dev_password}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - delivery-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DELIVERY_DB_USER:-supplychain} -d delivery_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  delivery-service:
    build: ./delivery-service
    container_name: delivery-service
    environment:
      DELIVERY_DB_HOST: postgres-delivery
      DELIVERY_DB_PORT: 5432
      DELIVERY_DB_USER: ${DELIVERY_DB_USER:-supplychain}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD:-supplychain_dev_password}
      DELIVERY_DB_NAME: delivery_db
      KAFKA_BROKERS: kafka:9092
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres-delivery:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/deliveries/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5


  # Wolf Auth Service (backend only; frontend/nginx intentionally not included)
  auth-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-wolf_auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-wolf_auth_dev_password}
      POSTGRES_DB: ${AUTH_DB_NAME:-wolf_auth}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    environment:
      DATABASE_URL: postgresql://${AUTH_DB_USER:-wolf_auth}:${AUTH_DB_PASSWORD:-wolf_auth_dev_password}@auth-postgres:5432/${AUTH_DB_NAME:-wolf_auth}
      SECRET_KEY: ${AUTH_JWT_SECRET:-local-dev-only-change-me-32-bytes-min}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-30}
      DEBUG: "false"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      # Check that Uvicorn is listening; avoids depending on the current /health response body.
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 3001), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.supplychain.rule=PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/users`) || PathPrefix(`/roles`) || PathPrefix(`/friends`) || PathPrefix(`/notifications`) || PathPrefix(`/achievements`) || PathPrefix(`/v3`) || Path(`/swagger-ui.html`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/webjars`)
      - traefik.http.routers.supplychain.entrypoints=web
      - traefik.http.routers.supplychain.priority=100
      - traefik.http.services.supplychain.loadbalancer.server.port=8080
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-only-change-me-32-bytes-min}
    depends_on:
      consul:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  supplier-postgres-data:
  order-postgres-data:
  delivery-postgres-data:
  auth-postgres-data:
  consul-data:
  kafka-data:
