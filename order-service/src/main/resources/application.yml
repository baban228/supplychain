server:
  port: 8081

spring:
  application:
    name: order-service
  r2dbc:
    url: ${ORDER_DATABASE_URL:r2dbc:postgresql://localhost:5434/order_db}
    username: ${ORDER_DB_USER:supplychain}
    password: ${ORDER_DB_PASSWORD:supplychain_dev_password}
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
