server:
  port: 8081

spring:
  application:
    name: order-service
  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        service-name: order-service
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        health-check-timeout: 5s
  r2dbc:
    url: ${ORDER_DATABASE_URL:r2dbc:postgresql://localhost:5434/order_db}
    username: ${ORDER_DB_USER:supplychain}
    password: ${ORDER_DB_PASSWORD:supplychain_dev_password}
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: order-service-events
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  supplier:
    client:
      timeout: ${SUPPLIER_CLIENT_TIMEOUT:2s}
    retry:
      max-attempts: ${SUPPLIER_RETRY_MAX_ATTEMPTS:3}
      wait-duration: ${SUPPLIER_RETRY_WAIT:300ms}
  kafka:
    outbox-poll-ms: ${KAFKA_OUTBOX_POLL_MS:1000}

