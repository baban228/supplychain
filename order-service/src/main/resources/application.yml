server:
  port: 8081

spring:
  application:
    name: order-service
  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        service-name: order-service
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        health-check-timeout: 5s
  r2dbc:
    url: ${ORDER_DATABASE_URL:r2dbc:postgresql://localhost:5434/order_db}
    username: ${ORDER_DB_USER:supplychain}
    password: ${ORDER_DB_PASSWORD:supplychain_dev_password}
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
